<header class="w-100 position-absolute" style="z-index: 1000;">
  <nav [ngClass]="verificaEnvironments() ? 'header-map' : 'navbar'" class="navbar-expand-md navbar-dark px-4 py-3">
    <div class="container-fluid px-0 d-flex justify-content-between align-items-center">

      <a class="navbar-brand text-white fw-bold fs-4 m-0" href="/">
        {{ environment.nome }}
      </a>

      <button class="navbar-toggler border-0 shadow-none order-md-2" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end order-md-1" id="menuNavegacao">
        <ul class="navbar-nav align-items-center gap-2 gap-md-4 mt-3 mt-md-0 text-center">

          <li class="nav-item">
            <a href="/" class="nav-link text-white fw-semibold">Início</a>
          </li>

          <li class="nav-item">
            <a href="/#sobre" class="nav-link text-white fw-semibold">Sobre</a>
          </li>

          <li class="nav-item">
            <a href="/#doacao" class="nav-link text-white fw-semibold">Doação</a>
          </li>

          <li class="nav-item" *ngIf="validaUsuarioLogado()">
            <a href="painel" class="nav-link text-white fw-semibold">Painel</a>
          </li>

          <li class="nav-item ms-md-2 mt-3 mt-md-0 w-100 w-md-auto">
            <a href="mapa" class="btn btn-light fw-bold px-4 py-2 rounded-pill w-100" style="color: var(--background-button);">
              Mapa
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>
</header>
