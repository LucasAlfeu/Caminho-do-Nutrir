<div #meuModal class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Deletar Solicitação</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="fecharModal()"
          style="border: none; background: transparent;">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p>Realizando essa ação todos os dados referentes a esse ponto será perdido.
          Deseja realmente deletar a solicita referente ao <strong>{{ getNomeEstacao() }}</strong>?</p>
      </div>
      <div class="modal-footer d-flex justify-content-between">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="fecharModal()">Fechar</button>
        <button type="button" class="btn btn-danger" (click)="_deletarSolicitacao()">Deletar</button>
      </div>
    </div>
  </div>
</div>
