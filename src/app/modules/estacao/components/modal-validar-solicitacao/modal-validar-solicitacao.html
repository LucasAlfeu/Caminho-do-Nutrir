<div #meuModal class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title font-weight-bold" style="font-size: 22px;" id="exampleModalLabel" >Validar Solicitação</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="fecharModal()"
          style="border: none; background: transparent;">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p>Este local ainda não aparece no mapa pois aguarda validação.
          Os dados estão corretos? Deseja validar a(o) <strong>{{ getNomeEstacao() }}</strong>?</p>
      </div>
      <div class="modal-footer d-flex justify-content-between">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="fecharModal()">Fechar</button>
        <button type="button" class="btn btn-primary" (click)="_validarSolicitacao()">Confirmar</button>
      </div>
    </div>
  </div>
</div>
