<div class="d-flex vh-100 overflow-hidden">

  <!-- Lado Esquerdo (Fixo) -->
  <div
    class="col-12 col-lg-4 text-white d-flex flex-column justify-content-between text-center p-5 sidebar-fixed h-100"
    style="background: var(--background-infor-lateral); overflow-y: auto;">
    <div class="mt-4">
      <h1 class="fw-bold display-4 lh-sm">{{ environment.nome }}</h1>
    </div>

    <div class="px-3">
      <h2 class="fw-bold mb-3">Indique um Local</h2>
      <p class="fs-4 lh-sm">
        Sua indicação<br>faz a diferença!<br>Compartilhe um<br>ponto que conhece<br>e expanda a rede.
      </p>
    </div>

    <div class="mb-4">
      <p class="fs-5 mb-0 lh-sm">
        Preencha os dados ao lado para que<br>possamos validar o local e incluí-lo no mapa.
      </p>
    </div>
  </div>

  <!-- Lado Direito (Formulário com Scroll) -->
  <div class="col-12 col-lg-8 bg-white p-5 form-scrollable d-flex flex-column h-100" style="overflow-y: auto;">

    <h2 class="fw-bold mb-3">Indicar local</h2>

    <div class="ml-3 mb-lg-1">
      <app-form-indicar-estacao #formSolicitar (cadastrar)="cadastrar($event)"></app-form-indicar-estacao>
    </div>

  </div>
</div>
