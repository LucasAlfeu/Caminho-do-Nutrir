<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<main class="w-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('/images/background-entrar.jpg');
             min-height: 100vh;
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;">

  <div class="glass-card p-5" style="width: 100%; max-width: 450px;">

    <h1 class="text-center fw-bold mb-5" style="color: var(--color-primary-entrar); letter-spacing: 1px;">ENTRAR</h1>

    <form [formGroup]="form">
      <div class="mb-4">
        <input type="text" formControlName="usuario" class="form-control input-underlined" placeholder="Usuario">
      </div>

      <div class="position-relative mb-5">
        <input [type]="showPassword ? 'text' : 'password'" class="form-control py-2 pe-5 input-underlined"
          formControlName="senha" placeholder="Digite sua senha">

        <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer; color: var(--show-password);"
          (click)="showPassword = !showPassword">

          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
            viewBox="0 0 16 16">
            <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z" />
            <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" />
          </svg>

          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
            viewBox="0 0 16 16">
            <path
              d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z" />
            <path
              d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z" />
            <path
              d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z" />
          </svg>
        </span>
      </div>

      <button type="button" class="btn btn-dark-custom w-100 fw-bold py-2 mb-4 fs-6"
        (click)="enviarCredenciais()">ENTRAR</button>
    </form>

    <div class="d-flex justify-content-between mt-2">
      <a href="/cadastrar" class="text-decoration-none fw-bold"
        style="color: var(--color-primary-entrar); font-size: 0.95rem;">Cadastrar</a>
      <button (click)="openMoalRecuperarSenha()" class="text-decoration-none fw-bold"
        style="color: var(--color-primary-entrar); font-size: 0.95rem; background: transparent; border: none;">Perdeu a senha?</button>
    </div>

  </div>
</main>

<app-modal-recuperar-senha #modalRecuperarSenha></app-modal-recuperar-senha>
