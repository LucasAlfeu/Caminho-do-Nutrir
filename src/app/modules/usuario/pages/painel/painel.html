<div class="wrapper-conteudo bg-light min-vh-100 pb-5">

  <header class="bg-header-custom px-4 py-4 d-flex flex-column justify-content-center border-bottom shadow-sm">
    <div class="container-fluid px-0">
      <h1 class="h3 fw-bold mb-1" style="color: var(--primary-color-text);">Bancos de Leite Humano</h1>
      <p class="mb-0 text-muted small">Gerenciamento e controle de bancos cadastrados no sistema</p>
    </div>
  </header>

  <main class="container-fluid px-4 pt-4">

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 gap-3">

      <div class="d-flex">

        <!-- Card: Total de Bancos (Locais Oficiais) -->
        <div
          class="card border-0 shadow-sm"
          style="border-radius: 16px; background-color: #f4efeb; min-width: 260px; margin-right: 1.5rem;"
        >
          <div class="card-body p-3 d-flex align-items-center">
            <div class="rounded-circle d-flex justify-content-center align-items-center me-3"
              style="width: 48px; height: 48px; background-color: rgba(74, 46, 27, 0.1);">
              <i class="bi bi-hospital fs-4" style="color: var(--primary-color-text);"></i>
            </div>
            <div>
              <h2 class="fs-6 fw-semibold text-muted mb-0">Total de Bancos</h2>
              <span class="fs-3 fw-bold d-block lh-1 mt-1" style="color: var(--primary-color-text);">
                {{ listBancosValidados.length }}
              </span>
            </div>
          </div>
        </div>

        <!-- Card: Total de Solicitações (Pendentes de Validação) -->
        <div class="card border-0 shadow-sm" style="border-radius: 16px; background-color: #fff3e0; min-width: 260px;">
          <div class="card-body p-3 d-flex align-items-center">
            <div class="rounded-circle d-flex justify-content-center align-items-center me-3"
              style="width: 48px; height: 48px; background-color: rgba(245, 124, 0, 0.15);">
              <!-- Ícone alterado para inbox (caixa de entrada) -->
              <i class="bi bi-inbox fs-4" style="color: var(--total-solicitacao);"></i>
            </div>
            <div>
              <h2 class="fs-6 fw-semibold text-muted mb-0">Total de Solicitações</h2>
              <span class="fs-3 fw-bold d-block lh-1 mt-1" style="color: var(--total-solicitacao);">
                {{ listBancosNaoValidados.length }}
              </span>
            </div>
          </div>
        </div>

      </div>

      <button class="btn text-white px-4 py-2 shadow-sm fw-medium d-flex align-items-center justify-content-center"
        style="background-color: var(--background-button); border-radius: 12px; height: 48px;" (click)="goTo()">
        <i class="bi bi-plus-lg me-2"></i> Adicionar Banco
      </button>

    </div>

    <div class="bg-white p-4 shadow-sm" style="border-radius: 16px;">

      <div [formGroup]="form" class="row mb-4 g-3 align-items-center">

        <div class="col-12 col-md">
          <div class="input-group shadow-sm" style="overflow: hidden; border-radius: 7px;">
            <span class="input-group-text bg-white border-end-0 text-muted px-4">
              <i class="bi bi-search"></i>
            </span>
            <input type="text" class="form-control border-start-0 ps-0" formControlName="filtroBanco"
              placeholder="Buscar banco pelo nome..." aria-label="Buscar por banco" style="box-shadow: none;">
          </div>
        </div>

        <div class="col-12 col-md-auto d-flex gap-2">

          <button type="button" class="btn btn-dark px-5 fw-medium shadow-sm flex-grow-1" style="border-radius: 7px;"
            (click)="filtrarPontos()">
            Buscar
          </button>

          <button type="button" class="btn btn-outline-secondary px-4 fw-medium shadow-sm flex-grow-1"
            style="border-radius: 7px;" (click)="limparFiltro()">
            Limpar
          </button>

        </div>

      </div>

      <!-- Componente da Lista -->
      <app-list-estacao-shared [listBancos]="listBancosValidados" [indTabelaInicio]="true">
      </app-list-estacao-shared>

    </div>
  </main>

  <app-modal-mark #modalMark [indLogado]="true"></app-modal-mark>

</div>
