<div class="wrapper-conteudo">

  <header class="bg-header-custom px-4 d-flex flex-column justify-content-center shadow-sm">
    <h1 class="h3 fw-bold mb-0">Bancos de Leite Humano</h1>
    <p class="mb-0 text-muted small">Gerenciamento de bancos cadastrados no sistema</p>
  </header>

  <div class="container-fluid p-4 form-scroll-area">

    <div class="form-container shadow-sm p-4 bg-white rounded-3">

      <h2 class="section-title mb-4 fs-5 fw-bold">
        Cadastrar Banco de Leite Humano
      </h2>

      <form>
        <div class="row g-3">
          <div class="col-md-7">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" class="form-control border-2" id="nome" placeholder="Digite o nome do banco">
            </div>

            <div class="row align-items-end">
              <div class="col-md-8">
                <label for="cep" class="form-label">CEP</label>
                <input type="text" class="form-control border-2" id="cep" placeholder="Informe o CEP">
              </div>
              <div class="col-md-4">
                <button type="button" class="btn btn-custom w-100 fw-semibold"
                  style="background-color: #4A2E1B; color: #fff;">
                  Buscar
                </button>
              </div>
            </div>
          </div>

          <div class="col-md-5">
            <div class="mb-3">
              <label for="descricao" class="form-label">Descrição</label>
              <textarea class="form-control border-2" id="descricao" rows="5"></textarea>
            </div>
          </div>
        </div>

        <div class="row g-3 mt-1">
          <div class="col-md-6">
            <label for="logradouro" class="form-label">Logradouro</label>
            <input type="text" class="form-control border-2" id="logradouro" placeholder="Digite o logradouro">
          </div>
          <div class="col-md-2">
            <label for="numero" class="form-label">Número</label>
            <input type="text" class="form-control border-2" id="numero" placeholder="Digite o número">
          </div>
          <div class="col-md-4">
            <label for="complemento" class="form-label">Complemento</label>
            <input type="text" class="form-control border-2" id="complemento" placeholder="Digite o complemento">
          </div>
        </div>

        <div class="row g-3 mt-1">
          <div class="col-md-4">
            <label for="bairro" class="form-label">Bairro</label>
            <input type="text" class="form-control border-2" id="bairro" placeholder="Digite o bairro">
          </div>
          <div class="col-md-5">
            <label for="cidade" class="form-label">Cidade</label>
            <input type="text" class="form-control border-2" id="cidade" placeholder="Digite a cidade">
          </div>
          <div class="col-md-3">
            <label for="uf" class="form-label">UF</label>
            <select class="form-select border-2" id="uf">
              <option selected>Selecione um UF</option>
              <option value="SP">SP</option>
              <option value="RJ">RJ</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mt-1">
          <div class="col-md-6">
            <label for="latitude" class="form-label">Latitude</label>
            <input type="text" class="form-control border-2" id="latitude" placeholder="Digite a latitude">
          </div>
          <div class="col-md-6">
            <label for="longitude" class="form-label">Longitude</label>
            <input type="text" class="form-control border-2" id="longitude" placeholder="Digite a longitude">
          </div>
        </div>

        <div class="d-flex justify-content-end mt-4">
          <button type="submit" class="btn px-5 fw-semibold" style="background-color: #4A2E1B; color: #fff;">
            Cadastrar
          </button>
        </div>
      </form>

    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
