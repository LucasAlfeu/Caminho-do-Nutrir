<main class="w-100 d-flex align-items-center justify-content-center"
      style="background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('/images/background-entrar.jpg');
             min-height: 100vh;
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;">

  <div class="glass-card p-5" style="width: 100%; max-width: 450px;">

    <h1 class="text-center fw-bold mb-5" style="color: #1a1a1a; letter-spacing: 1px;">ENTRAR</h1>

    <form action="">
      <div class="mb-4">
        <input type="email" class="form-control input-underlined" placeholder="Email">
      </div>

      <div class="mb-5">
        <input type="password" class="form-control input-underlined" placeholder="Senha">
      </div>

      <button type="submit" class="btn btn-dark-custom w-100 fw-bold py-2 mb-4 fs-6">ENTRAR</button>
    </form>

    <div class="d-flex justify-content-between mt-2">
      <a href="/cadastrar" class="text-decoration-none fw-bold" style="color: #1a1a1a; font-size: 0.95rem;">Cadastrar</a>
      <a href="#" class="text-decoration-none fw-bold" style="color: #1a1a1a; font-size: 0.95rem;">Perdeu a senha?</a>
    </div>

  </div>
</main>
