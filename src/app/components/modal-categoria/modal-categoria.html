<div #meuModal class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
  aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">
          <span *ngIf="getIndCadastro()">Cadastrar Categoria</span>
          <span *ngIf="getIndEdicao()">Editar Categoria</span>
          <span *ngIf="getIndDetalhe()">Detalhe da Categoria</span>
        </h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="fecharModal()"
          style="border: none; background: transparent;">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form [formGroup]="form">
          <div class="form-group">
            <label for="recipient-name" class="col-form-label">Nome</label>
            <input
              type="text"
              class="form-control"
              formControlName="nome"
              id="recipient-name"
              [ngClass]="{'is-invalid': campoInvalido('nome')}">

            <div class="text-danger small mt-1" *ngIf="campoInvalido('nome')">
              Campo obrigatório.
            </div>
          </div>
          <div class="form-group">
            <label for="message-text" class="col-form-label">Descição</label>
            <textarea
              formControlName="descricao"
              class="form-control"
              id="message-text"
              [ngClass]="{'is-invalid': campoInvalido('descricao')}"></textarea>

            <div class="text-danger small mt-1" *ngIf="campoInvalido('descricao')">
              Campo obrigatório.
            </div>
          </div>
          <div class="form-group d-flex mt-3 justify-content-between">
            <label for="" class="col-form-label">Selecione uma cor: </label>
            <div #colorPicker class="col-form-label" style="border: 2px;"></div>

            <!-- <div class="resultado">
                Cor selecionada: <strong>{{ corSelecionada }}</strong>
              </div> -->
          </div>

        </form>
      </div>
      <div class="modal-footer d-flex justify-content-between">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="fecharModal()">Fechar</button>
        <button type="button" class="btn btn-primary" *ngIf="getIndCadastro() || getIndEdicao()" (click)="_salvar()">
          <span *ngIf="getIndCadastro()">Cadastrar</span>
          <span *ngIf="getIndEdicao()">Atualizar</span>
        </button>
      </div>
    </div>
  </div>
</div>
