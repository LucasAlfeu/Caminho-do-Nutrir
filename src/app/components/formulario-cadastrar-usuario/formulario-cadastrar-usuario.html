<form class="w-100 mx-auto my-auto" style="max-width: 800px;" [formGroup]="form">

  <h2 class="fw-bold mb-2">Cadastro</h2>
  <p class="mb-5">Já possui conta? <a href="/entrar" class="text-decoration-none" style="color: #6a73fa;">Acesse
      aqui</a></p>

  <h4 class="fw-bold text-gray-custom mb-4">Dados básicos</h4>

  <div class="row g-4 mb-5">
    <div class="col-12 col-md-6">
      <label class="form-label fw-bold text-dark">Nome</label>
      <input type="text" class="form-control py-2" formControlName="nome" placeholder="Digite seu nome">
    </div>

    <div class="col-12 col-md-6">
      <label class="form-label fw-bold text-dark">CPF</label>
      <input type="text" class="form-control py-2" formControlName="cpf" placeholder="Digite seu cpf">
    </div>

    <div class="col-12 col-md-6">
      <label class="form-label fw-bold text-dark">Email</label>
      <input type="email" class="form-control py-2" formControlName="email" placeholder="Digite seu email">
    </div>

    <div class="col-12 col-md-6">
      <label class="form-label fw-bold text-dark">Matrícula</label>
      <input type="text" class="form-control py-2" formControlName="matricula" placeholder="Digite sua matrícula">
    </div>
  </div>

  <h4 class="fw-bold text-gray-custom mb-4">Dados para autenticação</h4>

  <div class="row g-4 mb-5">
    <div class="col-12 col-md-6">
      <label class="form-label fw-bold text-dark">Usuário</label>
      <input type="text" class="form-control py-2" formControlName="usuario" placeholder="Digite seu usuário">
    </div>
  </div>

  <div class="row g-4 mb-5">

    <div class="col-12 col-md-6">
      <label class="form-label fw-bold text-dark">Senha</label>
      <div class="position-relative">
        <input [type]="showPassword ? 'text' : 'password'" class="form-control py-2 pe-5" formControlName="senha"
          placeholder="Digite sua senha">

        <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer; color: #6c757d;"
          (click)="showPassword = !showPassword">

          <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
            viewBox="0 0 16 16">
            <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z" />
            <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" />
          </svg>

          <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
            viewBox="0 0 16 16">
            <path
              d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z" />
            <path
              d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z" />
            <path
              d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z" />
          </svg>
        </span>
      </div>
    </div>

    <div class="col-12 col-md-6">
      <label class="form-label fw-bold text-dark">Confirma senha</label>
      <div class="position-relative">
        <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control py-2 pe-5"
          formControlName="confirmaSenha" placeholder="Confirme a senha">

        <span class="position-absolute top-50 end-0 translate-middle-y me-3" style="cursor: pointer; color: #6c757d;"
          (click)="showConfirmPassword = !showConfirmPassword">

          <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
            viewBox="0 0 16 16">
            <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0z" />
            <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" />
          </svg>

          <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
            fill="currentColor" viewBox="0 0 16 16">
            <path
              d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z" />
            <path
              d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z" />
            <path
              d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z" />
          </svg>
        </span>
      </div>
    </div>

  </div>

  <div class="text-center mt-2 pb-4">
    <button type="button" class="btn btn-brown-custom fw-bold py-2" style="width: 50%; font-size: 1.15rem;"
      (click)="_cadastrar()">
      Cadastrar
    </button>
  </div>

</form>
